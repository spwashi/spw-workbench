<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Spw VS Code Extension Icon</title>
  <desc id="desc">A structured teal resonance ribbon rising through an implied workspace frame toward an amber probe point on a midnight navy square.</desc>

  <defs>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef8f2"/>
      <stop offset="100%" stop-color="#8db7d4"/>
    </linearGradient>

    <linearGradient id="ribbonTop" x1="20%" y1="20%" x2="82%" y2="78%">
      <stop offset="0%" stop-color="#94ffe8"/>
      <stop offset="38%" stop-color="#33d9d0"/>
      <stop offset="100%" stop-color="#097aa1"/>
    </linearGradient>

    <linearGradient id="ribbonUnder" x1="18%" y1="40%" x2="95%" y2="95%">
      <stop offset="0%" stop-color="#0d5c82"/>
      <stop offset="100%" stop-color="#0a2348"/>
    </linearGradient>

    <linearGradient id="highlight" x1="20%" y1="18%" x2="72%" y2="82%">
      <stop offset="0%" stop-color="#d8fff1"/>
      <stop offset="100%" stop-color="#6fe7d8"/>
    </linearGradient>

    <linearGradient id="probeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd36f"/>
      <stop offset="100%" stop-color="#f38c22"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#08162b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="184" fill="#102441"/>

  <g opacity="0.92">
    <path
      d="M 290 428 V 256 H 594"
      fill="none"
      stroke="url(#frameGradient)"
      stroke-width="48"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
    <path
      d="M 734 392 V 676 H 420"
      fill="none"
      stroke="url(#frameGradient)"
      stroke-width="48"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
  </g>

  <g filter="url(#softShadow)">
    <path
      d="M 258 612
         C 336 628 416 610 503 560
         C 602 503 673 414 748 244
         C 787 248 816 268 833 302
         C 797 472 745 595 658 682
         C 576 761 474 803 344 795
         C 302 792 271 782 258 770 Z"
      fill="url(#ribbonUnder)"
    />

    <path
      d="M 258 612
         V 474
         H 352
         C 447 474 529 415 626 296
         C 670 242 720 208 779 206
         C 736 281 703 354 681 422
         C 648 525 587 605 497 661
         C 423 707 343 720 258 696 Z"
      fill="url(#ribbonTop)"
    />

    <path
      d="M 314 513
         C 401 515 472 470 566 360
         C 595 326 629 294 675 269
         C 645 332 622 392 603 455
         C 573 554 510 619 422 649
         C 388 661 351 666 314 663 Z"
      fill="url(#highlight)"
      opacity="0.92"
    />

    <path
      d="M 258 474
         H 338
         V 526
         H 300
         V 650
         H 258 Z"
      fill="#12345a"
      opacity="0.94"
    />
  </g>

  <g transform="translate(774 214)">
    <circle r="22" fill="url(#probeGlow)"/>
    <path d="M 0 -46 L 0 -18" fill="none" stroke="#ffb438" stroke-width="10" stroke-linecap="round"/>
    <path d="M 30 -8 L 52 -4" fill="none" stroke="#f59b27" stroke-width="8" stroke-linecap="round"/>
    <path d="M -28 18 L -46 34" fill="none" stroke="#ffbf52" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
